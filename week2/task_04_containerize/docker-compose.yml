# Northwind assistant: API + UI with one command (Week 2, Task 4).
#
#   cp week1/.env.example week1/.env      # the ONLY file you supply; pick a provider in it
#   make up                               # = docker compose -f week2/task_04_containerize/docker-compose.yml up --build -d
#   open http://localhost:8501            # UI      (API: http://localhost:8000/docs)
#   make down                             # stop; the index volume is kept
#
# Paths below are relative to THIS file; the build context is the repo root.

name: northwind

x-env: &env
  # Later files win. container.env holds container-only defaults (e.g. where the host's
  # Ollama is); week1/.env is yours: provider, model, base_url, keys, k, chunking.
  # Passed at RUNTIME: neither file is ever copied into an image (see Dockerfile.dockerignore).
  env_file:
    - path: ./container.env
    - path: ../../week1/.env
      required: true

services:
  api:
    build:
      context: ../..
      dockerfile: week2/task_04_containerize/Dockerfile
      target: api
      args:
        # full = PyTorch embeddings (default, what the evals ran on); slim = ONNX, no torch.
        API_VARIANT: ${API_VARIANT:-full}
    image: northwind-api:${API_VARIANT:-full}
    <<: *env
    environment:
      # Fixed by the container layout, so not overridable from .env (a laptop path in .env
      # would otherwise break the container). Week 3 Task 3: the corpus is the Week 3 export,
      # mounted read-only below; its index has its own path on the named volume (the Week 1
      # index at /data/faiss_index is left alone).
      INDEX_PATH: /data/faiss_index_w3
      DATA_DIR: /corpus
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "${API_PUBLISH:-127.0.0.1:8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"     # lets the container reach the host's Ollama (Linux)
    volumes:
      # The FAISS index lives in a named volume: it survives `down`/`up`, restarts and
      # image rebuilds, so the corpus is embedded once, not on every rebuild.
      - index_data:/data
      # The corpus export, read-only: upstream data, never written by the service (Week 3).
      - ../../week3/corpus:/corpus:ro
    healthcheck:
      # Readiness, not just liveness: "healthy" = the index is loaded and the graph
      # compiled, so the UI below starts only when the API can actually answer.
      # (The image's own HEALTHCHECK is /healthz; this replaces it for compose.)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 180s       # first start on a new volume embeds the corpus
    stop_grace_period: 15s
    restart: unless-stopped

  ui:
    build:
      context: ../..
      dockerfile: week2/task_04_containerize/Dockerfile
      target: ui
    image: northwind-ui:latest
    # The UI only needs to know where the API is. By SERVICE NAME on the compose
    # network: inside a container, localhost is the container itself.
    environment:
      API_URL: http://api:8000
    ports:
      - "${UI_PUBLISH:-127.0.0.1:8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  index_data:
    # One index volume per image variant: full (PyTorch) and slim (ONNX) embeddings
    # differ slightly, so switching variants must not re-embed over the other's index.
    name: northwind_index_${API_VARIANT:-full}
